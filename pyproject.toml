[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "entra-mcp-server"
version = "0.1.0"
description = "An authenticated MCP server for Microsoft Entra ID directory operations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "msal>=1.31,<2",
    "PyJWT[crypto]>=2.10,<3",
    "starlette>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
entra-mcp-server = "entra_mcp_server.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
